name: Foundation Flutter Android
on:
  push:
    branches: [feature/navitaximeter-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: navifoundation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project (no map or billing)
        run: flutter create . --platforms=android --org vn --project-name navitaximeter
      - name: Inject location permissions for the lab
        run: |
          python3 tool/bootstrap_android.py
          python3 tool/bootstrap_android.py --check
      - name: Isolated SQLite post-commit ACK proof (no Android trip writer)
        run: python3 -m unittest discover -s tool -p 'test_checkpoint_sqlite_contract.py' -v
      - name: Python safety tests
        run: python3 -m unittest discover -s tool -p 'test_*.py' -v
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Kotlin Android location-owner JVM tests
        run: (cd android && ./gradlew :app:testDebugUnitTest --no-daemon)
      - name: Compile headless SQLite Android instrumented test (not executed without device)
        run: (cd android && ./gradlew :app:assembleDebugAndroidTest --no-daemon)
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --debug
      - name: Verify compiled Android GPS service and permissions
        run: python3 tool/verify_apk_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: navitaximeter-native-gps-safety-DEBUG-only
          path: build/app/outputs/flutter-apk/app-debug.apk

  emulator-probe:
    name: Android 14 emulator headless SQLite execution (NOT physical GPS)
    needs: build-test
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/navitaximeter-foundation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android test project and inject debug-only service
        run: |
          flutter create . --platforms=android --org vn --project-name navitaximeter
          python3 tool/bootstrap_android.py
          python3 tool/bootstrap_android.py --check
          flutter pub get
      - name: Enable Linux KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute debug-only headless SQLite probe on Android 14 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 480
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Require executed Android test XML (compilation is NOT sufficient)
        run: python3 tool/verify_android_probe_results.py android/app/build/outputs/androidTest-results/connected
      - name: Keep minimal test reports (no location/trip logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navitaximeter-headless-sqlite-emulator-DEBUG-only
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
          retention-days: 2
          if-no-files-found: warn
